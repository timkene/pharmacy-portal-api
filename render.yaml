services:
  - type: web
    name: pharmacy-dispatch-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SESSION_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: pharmacy_dispatch
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_BASE_URL
        value: https://pharmacy-portal-delta.vercel.app
      - key: MOTHERDUCK_TOKEN
        sync: false
      - key: MEDICLOUD_API_URL
        sync: false
      - key: MEDICLOUD_API_KEY
        sync: false
